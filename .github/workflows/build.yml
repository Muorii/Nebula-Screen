      - name: Bilder einsetzen (Ordner bilder/ im Repo)
        working-directory: src
        run: |
          pip install pillow --break-system-packages -q || pip install pillow -q
          python3 - <<'PYEND'
          from PIL import Image
          import os, shutil
          n = 'src/main/resources/assets/nebulatrack/textures/gui/'
          m = 'src/main/resources/assets/minecraft/textures/gui/title/'
          os.makedirs(n, exist_ok=True); os.makedirs(m, exist_ok=True)
          Image.open('../bilder/night_title.jpg').convert('RGB').save(n + 'night_title.png')
          shutil.copy('../bilder/logo.png', n + 'logo.png')
          shutil.copy('../bilder/minecraft.png', m + 'minecraft.png')
          Image.new('RGBA', (128, 14), (0, 0, 0, 0)).save(m + 'edition.png')
          PYEND
      - name: Passende Fabric-Versionen eintragen
        working-directory: src
        run: python3 update_versions.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Bauen
        working-directory: src
        run: gradle build --no-daemon
      - name: Fabric API holen und Release erstellen
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(grep '^fabric_version=' gradle.properties | cut -d= -f2)
          curl -fsSL -o build/libs/fabric-api.jar "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/${V}/fabric-api-${V}.jar"
          rm -f build/libs/*-sources.jar
          gh release create "track-${{ github.run_number }}" build/libs/*.jar --repo "${{ github.repository }}" --title "Nebula Track Build ${{ github.run_number }}" --notes "nebula-track + fabric-api in den mods-Ordner"
